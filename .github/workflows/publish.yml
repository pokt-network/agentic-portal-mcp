name: Publish to npm

# Publishes the version in package.json when npm does not have it yet, so
# raising the version is the whole release step. Runs on every push to main
# (each mirror update) and on demand; a version already on npm is skipped.
#
# Built and tested here before publishing, with npm provenance: the package
# page links the published tarball to this repository and this run.
#
# Auth: npm Trusted Publishing. npm trusts this repository's publish.yml and
# authenticates it through OIDC (id-token below); no npm token is stored
# anywhere, and the package refuses token publishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Is this version already on npm?
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $name@$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.check.outputs.publish == 'true'
        run: npm run build
      - if: steps.check.outputs.publish == 'true'
        run: npm test
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
