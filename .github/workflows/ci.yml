name: CI

# This repository is generated from Pocket Network Foundation's internal
# repository on every release; changes made here directly are overwritten.
# Issues and pull requests are welcome and are carried over by hand.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
